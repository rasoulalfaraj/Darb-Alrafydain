name: بناء تطبيق ملاحة العراق (Android APK CI/CD)

on:
  push:
    branches:
      - main
      - master
      - "**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-iraq-nav-apk:
    name: بناء ملف APK جاهز للتثبيت (Debug & Release)
    runs-on: ubuntu-latest

    steps:
      - name: سحب الكود المصدري (Checkout Repository)
        uses: actions/checkout@v4

      - name: إعداد بيئة Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: إعداد Android SDK
        uses: android-actions/setup-android@v3

      - name: إعداد Gradle 8.11.1 مع التخزين المؤقت
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: false

      - name: تجهيز ملف البيئة (.env) ومفاتيح التوقيع الرقمي (Keystores)
        env:
          MAPS_API_KEY_SECRET: ${{ secrets.MAPS_API_KEY }}
        run: |
          if [ ! -f ".env" ]; then
            cp .env.example .env
          fi
          if [ -n "$MAPS_API_KEY_SECRET" ]; then
            echo "MAPS_API_KEY=$MAPS_API_KEY_SECRET" > .env
          fi

          # توليد debug.keystore تلقائياً إن لم يكن موجوداً
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=IQ"
          fi

          # توليد مفتاح إصدار my-upload-key.jks للبناء المباشر على GitHub
          if [ ! -f "my-upload-key.jks" ]; then
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -storepass iraqnav2026 \
              -alias upload \
              -keypass iraqnav2026 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Darb AlRafidain Iraq Nav,OU=Mobile,O=IraqNav,L=Baghdad,ST=Baghdad,C=IQ"
          fi

      - name: بناء حزمة APK (Debug & Signed Release)
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'iraqnav2026' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'iraqnav2026' }}
        run: |
          gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: تجهيز وتسمية ملفات APK المخرجة
        run: |
          mkdir -p dist-apk
          cp app/build/outputs/apk/debug/app-debug.apk dist-apk/iraq-navigation-darb-debug.apk
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk dist-apk/iraq-navigation-darb-release.apk
          elif [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk dist-apk/iraq-navigation-darb-release.apk
          fi
          ls -lh dist-apk/

      - name: رفع ملف APK الجاهز للتحميل في GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Iraq-Navigation-APK-Darb-AlRafidain
          path: dist-apk/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: نشر إصدار تلقائي (GitHub Release) عند الدفع إلى الفرع الرئيسي أو الوسوم
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "ملاحة العراق - درب الرافدين (الإصدار رقم #${{ github.run_number }})"
          body: |
            ### 🇮🇶 تطبيق ملاحة العراق - درب الرافدين (APK جاهز للتثبيت)
            تم البناء التلقائي بنجاح عبر GitHub Actions.
            - **دعم كامل لخارطة العراق (18 محافظة)** مع التوجيه الصوتي العربي.
            - **البحث الذكي** عن الأماكن القريبة والمستشفيات ومحطات الوقود والمعالم.
            - **وضع العمل دون اتصال بالإنترنت** وحفظ سجل المواقع المفضلة.
          files: dist-apk/*.apk
          prerelease: false
